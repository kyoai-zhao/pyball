[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyball-arithmetic"
version = "0.1.0"
description = "Rigorous ball/interval arithmetic for Python: verified enclosures with directed rounding."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yanxin Zhao" }]
keywords = ["interval-arithmetic", "rigorous-numerics", "verified-computing", "ball-arithmetic", "numerical-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
mpmath = ["mpmath>=1.3"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kyoai-zhao/pyball"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyball = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]